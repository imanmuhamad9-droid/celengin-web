<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celengin - Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf8ff;font-family:Arial,Helvetica,sans-serif;color:#1f2937;text-align:center;padding:24px}
    .card{background:#fff;border:1px solid #f3f4f6;border-radius:24px;padding:32px 24px;max-width:340px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
    img{width:64px;height:64px;border-radius:16px;object-fit:contain}
    h1{font-size:18px;margin:16px 0 6px;color:#115e59}
    p{font-size:13px;color:#6b7280;margin:0 0 20px;line-height:1.5}
    button{background:#0f766e;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon.png" alt="Celengin">
    <h1>Kamu sedang offline</h1>
    <p>Celengin butuh internet untuk menampilkan data keuanganmu. Sambungkan lagi lalu coba muat ulang.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
